name: Compilar GeneradorDocumentos.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install python-docx pillow pyinstaller

      - name: Compilar el .exe
        run: |
          pyinstaller --onefile --windowed --name "GeneradorDocumentos" app.py

      - name: Subir el .exe como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: GeneradorDocumentos-Windows
          path: dist/GeneradorDocumentos.exe
          retention-days: 30
